<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#e58fb0">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Babskie">
<title>Babskie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#fde9ee; --surface:#fffaf8; --card:#ffffff; --ink:#43344a; --muted:#8f7f98; --line:#f3dce6;
  --olive:#e0799f; --olive-d:#c9628a; --olive-l:#fde6ef; --terra:#e0799f; --danger:#c43a5a;
  --shadow:0 1px 2px rgba(120,60,100,.06),0 6px 18px rgba(150,80,120,.12);
  --mk1:rgba(255,226,120,.9); --mk2:rgba(255,190,210,.8);
  --h1:#f4a9c4; --h2:#c7a8ee;
}
.c0{--h1:#f4a9c4;--h2:#c7a8ee;--dot:#ee7fa6}
.c1{--h1:#ffc79a;--h2:#f4a9c4;--dot:#ffa45c}
.c2{--h1:#ffe08a;--h2:#ffb59a;--dot:#f2c230}
.c3{--h1:#9fe0c4;--h2:#8fc8ee;--dot:#4fc29a}
.c4{--h1:#9cc8f4;--h2:#c4b2f2;--dot:#5a9ee6}
.c5{--h1:#cdb2f4;--h2:#f4a9d0;--dot:#a77ae6}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5}
button{font-family:inherit}
.app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--surface);box-shadow:0 0 40px rgba(60,50,30,.08);position:relative}
.loading{padding:40px 20px;text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.err{color:#a11;background:#fdecea;padding:12px 14px;border-radius:12px;margin:16px}
svg.ic{flex:0 0 auto}

/* nagłówek */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 18px 6px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink);font-family:'Caveat','Segoe Script',cursive;font-weight:700;font-size:2rem;line-height:.92}
.brand .mtn{margin-top:2px;width:96px;height:auto;opacity:.9}
.top-r{display:flex;align-items:center;gap:6px}
.userbtn{display:inline-flex;align-items:center;gap:6px;background:#eeeadf;border:0;border-radius:10px;padding:10px 12px;font-size:.95rem;font-weight:500;color:var(--ink);cursor:pointer}
.iconbtn{width:40px;height:40px;display:grid;place-items:center;border:0;background:none;color:var(--ink);border-radius:10px;cursor:pointer}
.iconbtn:hover{background:#eeeadf}
.page{padding:12px 18px 40px}

/* przyciski */
.pbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;width:100%;background:var(--olive);color:#fff;border:0;border-radius:14px;padding:14px 18px;font-size:1rem;font-weight:600;cursor:pointer;box-shadow:0 4px 12px rgba(88,99,58,.28);transition:background .15s,transform .1s}
.pbtn:hover{background:var(--olive-d)}
.pbtn:active{transform:scale(.99)}
.pbtn:disabled{opacity:.6;cursor:wait}
.pbtn.sm{width:auto;padding:10px 18px;border-radius:12px;font-size:.95rem;box-shadow:none}
.pbtn.ghost{background:#fff;color:var(--olive-d);border:1px solid var(--line);box-shadow:none}
.pbtn.ghost:hover{background:var(--olive-l)}
.chip{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--olive-d);border:1px solid var(--line);border-radius:999px;padding:9px 16px;font-size:.88rem;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap;box-shadow:0 1px 2px rgba(60,50,30,.06);transition:background .15s,color .15s,border-color .15s}
.chip:hover{background:var(--olive);color:#fff;border-color:var(--olive)}
.chip.danger{color:var(--danger)}
.chip.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger)}
.rbtn{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--ink);display:grid;place-items:center;border:0;cursor:pointer;text-decoration:none;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.rbtn.light{background:#eeeadf;box-shadow:none}
.kebab{width:34px;height:34px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:50%;cursor:pointer;flex:0 0 auto}
.kebab:hover{background:#f0ece3;color:var(--ink)}

/* sortowanie */
.sortrow{display:flex;gap:10px;margin:14px 0 18px}
.sortsel{flex:1;position:relative;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:48px;font-size:.95rem}
.sortsel select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;color:var(--ink);padding:0 22px 0 0;height:100%;flex:1;cursor:pointer;outline:none}
.sortsel .ic{position:absolute;right:12px;pointer-events:none;color:var(--muted)}
.sqbtn{width:48px;height:48px;display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;color:var(--ink);cursor:pointer}
.sqbtn:hover{background:var(--olive-l)}

/* ramki na zdjęcia */
.fr{margin:0;background:#fff;padding:5px 5px 15px;box-shadow:0 2px 7px rgba(60,40,20,.28);transform:rotate(var(--r,0deg));cursor:zoom-in}
.fr img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.fr.wide img{aspect-ratio:4/3}
.fr .ph{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(135deg,#dfe5c8,#c9d2a6);color:#fff;font-family:'Caveat',cursive;font-weight:700;font-size:2.6rem}

/* karty wyjazdów */
.tcard{position:relative;display:flex;align-items:stretch;background:var(--card);border-radius:18px;box-shadow:var(--shadow);margin:0 0 14px;cursor:pointer}
.tcard .thumb{flex:0 0 42%;padding:8px 0 8px 8px;display:flex;background:var(--card);border-radius:18px 0 0 18px}
.tcard .thumb .fr{width:100%;cursor:pointer;align-self:center;padding:4px 4px 12px}
.tcard .thumb .fr>img,.tcard .thumb .fr>.ph{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover}
.tcard .thumb .fr>img{display:block}
.tcard .tinfo{flex:1;min-width:0;padding:16px 44px 14px 16px;display:flex;flex-direction:column}
.tcard h3{font-size:1.15rem;font-weight:700;margin:0 0 4px;line-height:1.25;overflow-wrap:anywhere}
.tcard .yr{font-size:1.5rem;font-weight:700;line-height:1.15;color:var(--ink)}
.tcard .dates{color:var(--muted);font-size:.85rem;margin-top:1px}
.tcard .tcount{margin-top:auto;align-self:flex-end;display:flex;align-items:center;gap:6px;color:var(--muted);font-size:.92rem;padding-top:10px}
.tcard .kebab{position:absolute;top:10px;right:8px}
.empty{text-align:center;padding:50px 16px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:4px}

/* hero wyjazdu */

.hero-bar{display:flex;justify-content:space-between;position:relative;z-index:2}
.hero-body{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-top:28px}
.hero-txt{min-width:0}
.hero h1{font-family:'Caveat',cursive;font-weight:700;font-size:2.7rem;line-height:1.25;margin:0;overflow-wrap:anywhere}
.hero-dates{margin-top:10px;font-weight:600;font-size:1rem}
.hero-count{margin-top:12px;display:inline-flex;align-items:center;gap:6px;font-weight:600;opacity:.95}
.hero.has-cover{background-size:cover;background-position:center;min-height:280px;display:flex;flex-direction:column;justify-content:space-between}
.hero.has-cover::before{display:none}
.hero.has-cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,24,10,.45) 0%,rgba(20,24,10,.55) 55%,rgba(20,24,10,.72) 100%);z-index:1}
.hero h1,.hero-dates,.hero-count{text-shadow:0 1px 6px rgba(0,0,0,.35)}
.mk{background-image:linear-gradient(100deg,transparent 0,var(--mk1) 2%,var(--mk1) 98%,transparent 100%);padding:.04em .32em;margin:0 -.1em;border-radius:.5em .15em .45em .2em / .3em .2em .35em .2em;-webkit-box-decoration-break:clone;box-decoration-break:clone;color:var(--ink)}
.mk.mk2{background-image:linear-gradient(100deg,transparent 0,var(--mk2) 2%,var(--mk2) 98%,transparent 100%);display:inline-block;transform:rotate(-.8deg);padding:.12em .5em}

/* arkusz z zakładkami */
.sheet{position:relative;z-index:3;margin-top:-26px;background:var(--surface);border-radius:26px 26px 0 0;padding:16px 16px 120px;min-height:55vh}
.sheet.flat{margin-top:0;border-radius:0;padding-bottom:40px;min-height:0}
.tabs{display:flex;gap:4px;overflow-x:auto;margin:0 0 16px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 16px;border-radius:999px;font-size:.95rem;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab.on{background:var(--olive);color:#fff}
.toolrow{display:flex;justify-content:flex-end;margin:0 0 14px}

/* oś czasu */
.tl{position:relative}
.tl::before{content:'';position:absolute;left:61px;top:16px;bottom:16px;width:2px;background:var(--line)}
.tl-item{display:grid;grid-template-columns:50px 24px 1fr;align-items:start;margin-bottom:16px;position:relative}
.tl-date{line-height:1.15;color:var(--muted);font-size:.78rem;padding-top:8px}
.tl-date span{display:block}
.tl-date b{display:block;font-size:1.65rem;color:var(--ink);font-weight:600;line-height:1.05}
.tl-date b.mo{font-size:1.25rem;text-transform:lowercase}
.tl-date b.yr{font-size:1.1rem}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--terra);margin:20px 0 0 6px;position:relative;z-index:1;box-shadow:0 0 0 3px var(--surface)}
.tl-card{background:var(--card);border-radius:16px;padding:14px 14px 16px;box-shadow:var(--shadow);min-width:0}
.tl-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tl-head h3{font-size:1.05rem;font-weight:700;margin:0;line-height:1.3;overflow-wrap:anywhere}
.tl-by{font-size:.8rem;color:var(--muted);margin-top:1px;padding-top:2px}
.tl-head .kebab{margin:-6px -6px 0 0}
.tl-body{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0 0;font-size:.95rem;color:#443f38}
.tl-photos{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.addph{margin-top:14px;display:inline-flex;align-items:center;gap:8px;background:#f2eee5;border:0;border-radius:10px;padding:10px 14px;font-size:.9rem;font-weight:500;color:var(--ink);cursor:pointer}
.addph:hover{background:var(--olive-l)}

/* galeria, notatki, informacje */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px}
.gal .fr{padding:5px 5px 18px}
.notecard{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.notecard .nd{font-size:.8rem;color:var(--muted)}
.notecard h3{font-size:1.02rem;margin:2px 0 4px}
.notecard p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.95rem;color:#443f38}
.info{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:6px 16px}
.info .irow{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.info .irow:last-child{border-bottom:0}
.info .irow span:first-child{color:var(--muted)}
.info .irow span:last-child{font-weight:600;text-align:right;overflow-wrap:anywhere}
.info-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}

/* pływający przycisk */
.fab{position:fixed;bottom:22px;right:calc((100vw - min(100vw,640px))/2 + 16px);width:auto;z-index:60;border-radius:999px;padding:14px 22px;box-shadow:0 8px 22px rgba(60,70,30,.4)}

/* menu */
.menu{position:fixed;z-index:400;background:#fff;border-radius:14px;box-shadow:0 10px 32px rgba(40,30,10,.22);padding:6px;min-width:210px}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:0;background:none;border-radius:9px;font-size:.95rem;color:var(--ink);cursor:pointer;text-align:left}
.menu button:hover{background:#f3efe6}
.menu button.danger{color:var(--danger)}
.menu button .ic{color:var(--muted)}
.menu button.danger .ic{color:var(--danger)}

/* arkusz formularza (pełny ekran) */
.ovl{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;z-index:200;background:var(--surface);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.ovl-in{max-width:640px;margin:0 auto;min-height:100%;padding:0 18px 48px}
.sh-top{position:sticky;top:0;z-index:5;background:var(--surface);display:flex;align-items:center;gap:12px;padding:14px 0 10px}
.sh-top h2{flex:1;margin:0;font-size:1.45rem;font-weight:700}
.sh-sub{margin:0 0 4px;font-size:.92rem}
label{display:block;margin:18px 0 6px;font-size:.85rem;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;font:inherit;color:var(--ink);padding:12px 14px;border:1px solid var(--line);background:#fff;border-radius:12px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--olive-l);border-color:var(--olive)}
textarea{min-height:150px;resize:vertical}
.row{display:flex;gap:12px}
.row>label{flex:1;min-width:0}
.fld.two{display:flex;gap:8px}
.hint{font-size:.82rem;margin:6px 0 0}
.fld.two select{flex:1;min-width:0}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.th{position:relative}
.th .fr{cursor:default;padding:4px 4px 12px}
.th button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:#fff;cursor:pointer;display:grid;place-items:center;z-index:2}
.add-row{display:flex;gap:12px;margin-top:14px;align-items:stretch}
.plus-tile{flex:0 0 86px;height:86px;border:2px dashed #d3cab6;border-radius:14px;background:#f4f0e6;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.add-row .pbtn{flex:1;height:86px;font-size:1rem}
.status{margin:14px 0 0;font-size:.9rem;color:var(--muted)}

/* ekrany logowania */
.auth{display:flex;flex-direction:column}
.auth-hero{padding:70px 24px 74px;text-align:center}
.auth-title{position:relative;z-index:2;font-family:'Caveat',cursive;font-weight:700;font-size:3.4rem;line-height:1.05}
.auth-sub{position:relative;z-index:2;margin:10px 0 0;opacity:.92;font-weight:500}
.auth-sheet{flex:1;padding:30px 22px 40px;min-height:0}
.auth-sheet h2{font-size:1.5rem;margin:0 0 4px}
.auth-sheet form{margin-top:16px}
.auth-sheet input{width:100%;font:inherit;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff}
.auth-sheet .status{min-height:1.3em;color:var(--muted);font-size:.9rem;margin:8px 0 0}
.auth-sheet .pbtn{margin-top:14px}
.center-card{max-width:380px;margin:14vh auto 0;background:#fff;padding:30px 22px 22px;border-radius:22px;box-shadow:var(--shadow);text-align:center}
.center-card h1{font-family:'Caveat',cursive;font-weight:700;font-size:2.8rem;color:var(--olive-d);margin:0;line-height:1.1}
.center-card form{text-align:left}
.center-card .pbtn{margin-top:18px}
.cc-wrap{padding:0 16px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:500}
.lb img{max-width:94vw;max-height:88vh;box-shadow:0 0 30px #000}
.lb button{position:absolute;background:rgba(255,255,255,.15);color:#fff;border:0;font-size:2rem;cursor:pointer;width:52px;height:52px;border-radius:50%}
.lb .x{top:14px;right:14px;font-size:1.4rem}
.lb .prev{left:10px}.lb .next{right:10px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;z-index:600;max-width:90vw;font-size:.92rem;text-align:center}
@media (max-width:420px){.hero h1{font-size:2.3rem}.hero-fr{flex-basis:92px;width:92px}.tl-item{grid-template-columns:46px 22px 1fr}.tl::before{left:57px}.tl-dot{margin-left:5px}}


body{background:var(--bg) radial-gradient(circle at 15% 8%,#ffd9e6 0,transparent 35%),radial-gradient(circle at 90% 30%,#e6dcff 0,transparent 32%),radial-gradient(circle at 10% 70%,#d9f2e6 0,transparent 30%);background-attachment:fixed}
.brand{font-family:'Pacifico','Caveat',cursive;font-weight:400;font-size:1.9rem;line-height:1.05;background:linear-gradient(90deg,#ee7fa6,#ffa45c,#a77ae6);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{background:inherit;-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{background:linear-gradient(150deg,var(--h1) 0%,var(--h2) 100%);color:#43344a}
.hero:not(.has-cover) .rbtn{background:rgba(255,255,255,.85)}
.hero:not(.has-cover)::before{background:radial-gradient(circle at 85% 30%,rgba(255,255,255,.55) 0 38px,transparent 40px),radial-gradient(circle at 70% 80%,rgba(255,255,255,.4) 0 22px,transparent 24px),radial-gradient(circle at 95% 75%,rgba(255,255,255,.35) 0 14px,transparent 16px);width:100%;height:100%;right:0;bottom:0;opacity:1}
.hero:not(.has-cover) h1,.hero:not(.has-cover) .hero-dates,.hero:not(.has-cover) .hero-count{text-shadow:none}
.hero.has-cover{color:#fff}
.tl-dot{background:#ee7fa6}.tl-item:nth-child(6n+2) .tl-dot{background:#ffa45c}.tl-item:nth-child(6n+3) .tl-dot{background:#f2c230}.tl-item:nth-child(6n+4) .tl-dot{background:#4fc29a}.tl-item:nth-child(6n+5) .tl-dot{background:#5a9ee6}.tl-item:nth-child(6n) .tl-dot{background:#a77ae6}
.tcard:nth-of-type(6n+1){border-left:6px solid #f4a9c4}.tcard:nth-of-type(6n+2){border-left:6px solid #ffc79a}.tcard:nth-of-type(6n+3){border-left:6px solid #ffe08a}.tcard:nth-of-type(6n+4){border-left:6px solid #9fe0c4}.tcard:nth-of-type(6n+5){border-left:6px solid #9cc8f4}.tcard:nth-of-type(6n){border-left:6px solid #cdb2f4}
.fr .ph{background:linear-gradient(135deg,#ffd9e6,#e6dcff);color:#fff}
.tab.on,.pbtn{color:#fff}
.pbtn{box-shadow:0 4px 12px rgba(224,121,159,.35)}
.userbtn,.iconbtn:hover,.rbtn.light{background:#fbe3ec}
.brand .mtn{width:92px;height:auto;margin-top:0}

/* ---------- daty ---------- */
const MONTHS = ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const MONTHS_GEN = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];
const MON_ABBR = ['sty','lut','mar','kwi','maj','cze','lip','sie','wrz','paź','lis','gru'];
function parts(d){ const [y,m,dd] = d.split('-').map(Number); return {y, m, d: dd}; }
function fmtDate(d, prec){
  if (!d) return '';
  const p = parts(d);
  if (prec === 'year') return String(p.y);
  if (prec === 'month') return `${MONTHS[p.m-1]} ${p.y}`;
  return `${p.d} ${MONTHS_GEN[p.m-1]} ${p.y}`;
}
/* kafelek: duży rok i drobna krótka data, np. „12–15 paź” */
function cardDates(t){
  const a = parts(t.date_from), b = t.date_to ? parts(t.date_to) : null, prec = t.date_precision;
  const diffYear = b && b.y !== a.y;
  const year = diffYear ? `${a.y}–${b.y}` : String(a.y);
  let short = '';
  if (prec === 'month'){
    short = b && (b.m !== a.m || diffYear) ? `${MON_ABBR[a.m - 1]} – ${MON_ABBR[b.m - 1]}` : MON_ABBR[a.m - 1];
  } else if (prec === 'day'){
    if (!b || t.date_to === t.date_from) short = `${a.d} ${MON_ABBR[a.m - 1]}`;
    else if (b.m === a.m && !diffYear) short = `${a.d}–${b.d} ${MON_ABBR[a.m - 1]}`;
    else short = `${a.d} ${MON_ABBR[a.m - 1]} – ${b.d} ${MON_ABBR[b.m - 1]}`;
  }
  return `<div class="yr">${esc(year)}</div>${short ? `<div class="dates">${esc(short)}</div>` : ''}`;
}
function fmtRange(a, b, prec){
  const x = fmtDate(a, prec);
  if (!b || b === a) return x;
  return `${x} – ${fmtDate(b, prec)}`;
}
function fromInputVal(v, prec){
  if (!v) return null;
  if (prec === 'year') return /^\d{4}$/.test(v) ? v + '-01-01' : null;
  if (prec === 'month') return /^\d{4}-\d{2}$/.test(v) ? v + '-01' : null;
  return /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null;
}
const todayStr = () => { const t = new Date(); return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`; };

/* wybór daty z poziomem dokładności (dzień / miesiąc / rok); rok i miesiąc wybierane z listy */
const YEAR_MAX = new Date().getFullYear() + 1, YEAR_MIN = 1930;
function opt(value, label){ const o = document.createElement('option'); o.value = value; o.textContent = label; return o; }
const pad2 = n => String(n).padStart(2, '0');
const addDays = (d, n) => { const t = new Date(d + 'T12:00:00'); t.setDate(t.getDate() + n); return `${t.getFullYear()}-${pad2(t.getMonth() + 1)}-${pad2(t.getDate())}`; };
function startOfPeriod(v, prec){ const p = parts(v); return prec === 'day' ? v : prec === 'month' ? `${p.y}-${pad2(p.m)}-01` : `${p.y}-01-01`; }
function endOfPeriod(v, prec){ const p = parts(v); return prec === 'day' ? v : prec === 'month' ? `${p.y}-${pad2(p.m)}-${pad2(new Date(p.y, p.m, 0).getDate())}` : `${p.y}-12-31`; }
/* czy dany dzień / miesiąc / rok zahacza o dozwolony zakres */
const fits = (v, prec, range) => !range || (endOfPeriod(v, prec) >= range.min && startOfPeriod(v, prec) <= range.max);
const clampTo = (v, range) => !range ? v : v < range.min ? range.min : v > range.max ? range.max : v;
const MAX_TRIP_DAYS = 21;   // maksymalna długość wyjazdu / wydarzenia (3 tygodnie)
function endRangeFor(start, prec){
  if (!start) return null;
  const p = parts(start);
  if (prec === 'day') return { min: start, max: addDays(start, MAX_TRIP_DAYS) };
  if (prec === 'month'){ const ny = p.m === 12 ? p.y + 1 : p.y, nm = p.m === 12 ? 1 : p.m + 1; return { min: `${p.y}-${pad2(p.m)}-01`, max: endOfPeriod(`${ny}-${pad2(nm)}-01`, 'month') }; }
  return { min: `${p.y}-01-01`, max: `${p.y + 1}-12-31` };
}
/* zakres dat, w którym mogą się mieścić wpisy danego wyjazdu */
function tripRange(trip){
  const prec = trip.date_precision || 'day';
  const a = trip.date_from, b = trip.date_to || trip.date_from;
  return { min: startOfPeriod(a, prec), max: endOfPeriod(b, prec) };
}
function buildField(prec, val, optional, range){
  const el = document.createElement('div');
  if (!optional && !val) val = todayStr();
  if (val && range){ if (optional){ if (!fits(val, prec, range)) val = null; } else val = clampTo(val, range); }
  if (prec === 'day'){
    const inp = document.createElement('input'); inp.type = 'date'; inp.value = val || '';
    if (range){ inp.min = range.min; inp.max = range.max; }
    el.appendChild(inp);
    return { el, get: () => fromInputVal(inp.value, 'day') };
  }
  const p = val ? parts(val) : null;
  const ys = document.createElement('select');
  if (optional) ys.appendChild(opt('', 'rok'));
  const years = [];
  const yHi = range ? parts(range.max).y : YEAR_MAX, yLo = range ? parts(range.min).y : YEAR_MIN;
  for (let y = yHi; y >= yLo; y--) years.push(y);
  if (p && !years.includes(p.y) && !range){ years.push(p.y); years.sort((a, b) => b - a); }
  years.forEach(y => ys.appendChild(opt(String(y), String(y))));
  ys.value = p ? String(p.y) : '';
  if (prec === 'year'){
    el.appendChild(ys);
    return { el, get: () => ys.value ? ys.value + '-01-01' : null };
  }
  const ms = document.createElement('select');
  const fillMonths = () => {
    const keepM = ms.value;
    ms.replaceChildren();
    if (optional) ms.appendChild(opt('', 'miesiąc'));
    const y = ys.value ? Number(ys.value) : null;
    MONTHS.forEach((n, i) => { if (!range || !y || fits(`${y}-${pad2(i + 1)}-01`, 'month', range)) ms.appendChild(opt(String(i + 1), n)); });
    if (keepM && Array.from(ms.options).some(o => o.value === keepM)) ms.value = keepM;
    else if (!optional && ms.options.length) ms.value = ms.options[0].value;
  };
  fillMonths();
  ms.value = p ? String(p.m) : '';
  if (!ms.value && ms.options.length && !optional) ms.value = ms.options[0].value;
  ys.addEventListener('change', fillMonths);
  el.className = 'fld two';
  el.appendChild(ms); el.appendChild(ys);
  return { el, get: () => (ys.value && ms.value) ? `${ys.value}-${pad2(ms.value)}-01` : null };
}
function makeDatePicker({date = null, end = null, prec = 'day', withEnd = false, range = null, span = false} = {}){
  const el = document.createElement('div');
  el.innerHTML = `
    <label>Dokładność daty
      <select class="prec">
        <option value="day">Dokładna data</option>
        <option value="month">Miesiąc i rok</option>
        <option value="year">Tylko rok</option>
      </select>
    </label>
    <div class="row">
      <label>${withEnd ? 'Od' : 'Data'}<div class="slot1"></div></label>
      ${withEnd ? '<label>Do (opcjonalnie)<div class="slot2"></div></label>' : ''}
    </div>
    ${span ? '<p class="muted hint">Maksymalnie 3 tygodnie od daty początkowej.</p>' : ''}
    ${range ? `<p class="muted hint">Dozwolony zakres: ${esc(fmtRange(range.min, range.max, 'day'))}</p>` : ''}`;
  const sel = $('.prec', el), s1 = $('.slot1', el), s2 = $('.slot2', el);
  let cur1 = date, cur2 = end, curPrec = prec, f1, f2, first = true;
  const endRange = () => span ? endRangeFor(f1.get(), curPrec) : null;
  function paintEnd(){
    if (!s2) return;
    let r = endRange();
    if (first && r && cur2 && !fits(cur2, curPrec, r)) r = { min: r.min, max: cur2 > r.max ? endOfPeriod(cur2, curPrec) : r.max };   // starsze dane: nie kasuj od razu
    f2 = buildField(curPrec, cur2, true, r); s2.replaceChildren(f2.el);
  }
  function paint(){
    f1 = buildField(curPrec, cur1, false, range); s1.replaceChildren(f1.el);
    paintEnd(); first = false;
  }
  sel.value = prec; paint();
  sel.onchange = () => {
    cur1 = f1.get() || cur1;
    if (f2) cur2 = f2.get();
    curPrec = sel.value; paint();
  };
  if (span) s1.addEventListener('change', () => { cur2 = f2 ? f2.get() : cur2; paintEnd(); });
  return { el, endRange, get: () => ({ date: f1.get(), end: f2 ? f2.get() : null, prec: curPrec }) };
}

/* ---------- zdjęcia ---------- */
async function resizeImage(file, max = 1600, quality = 0.8){
  const url = URL.createObjectURL(file);
  try {
    const img = new Image();
    img.src = url;
    await img.decode();
    const scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('Nie udało się przetworzyć zdjęcia')), 'image/jpeg', quality));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadImage(file, folder){
  const blob = await resizeImage(file);
  const path = `${folder}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from('photos').upload(path, blob, { contentType: 'image/jpeg' });
  if (error) throw error;
  return path;
}
async function signed(paths){
  paths = [...new Set((paths || []).filter(Boolean))];
  if (!paths.length) return {};
  const { data } = await sb.storage.from('photos').createSignedUrls(paths, 3600);
  const m = {};
  (data || []).forEach(x => { if (x.signedUrl) m[x.path] = x.signedUrl; });
  return m;
}
const removePhotos = async paths => { paths = (paths || []).filter(Boolean); if (paths.length) await sb.storage.from('photos').remove(paths); };
function pickPhotos(cb){
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
  inp.onchange = () => { const f = Array.from(inp.files || []); if (f.length) cb(f); };
  inp.click();
}

/* zapis z pominięciem kolumn, których baza jeszcze nie ma (np. edited_by, title) */
const OPTIONAL_COLS = ['edited_by', 'title', 'kind', 'category'];
async function writeRow(table, row, id){
  const r = { ...row }, dropped = [];
  for (let k = 0; k <= OPTIONAL_COLS.length; k++){
    const { error } = id ? await sb.from(table).update(r).eq('id', id) : await sb.from(table).insert(r);
    if (!error) return dropped;
    const col = OPTIONAL_COLS.find(c => c in r && new RegExp(c).test(error.message || ''));
    if (!col) throw error;
    delete r[col]; dropped.push(col);
  }
  return dropped;
}

let menuEl = null, menuOff = null;
function closeMenu(){ if (menuEl){ menuEl.remove(); menuEl = null; } if (menuOff){ menuOff(); menuOff = null; } }
function openMenu(anchor, items){
  closeMenu();
  const m = document.createElement('div'); m.className = 'menu';
  m.innerHTML = items.map((it, i) => `<button type="button" class="${it.danger ? 'danger' : ''}" data-i="${i}">${it.icon || ''}${esc(it.label)}</button>`).join('');
  document.body.appendChild(m); menuEl = m;
  const r = anchor.getBoundingClientRect(), w = m.offsetWidth, h = m.offsetHeight;
  m.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - h - 8)) + 'px';
  m.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  m.onclick = e => { const b = e.target.closest('button'); if (!b) return; const it = items[+b.dataset.i]; closeMenu(); it.onClick(); };
  const outside = e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); };
  const esc2 = e => { if (e.key === 'Escape') closeMenu(); };
  const off = () => closeMenu();
  setTimeout(() => { document.addEventListener('pointerdown', outside, true); document.addEventListener('keydown', esc2); window.addEventListener('scroll', off, true); window.addEventListener('resize', off); });
  menuOff = () => { document.removeEventListener('pointerdown', outside, true); document.removeEventListener('keydown', esc2); window.removeEventListener('scroll', off, true); window.removeEventListener('resize', off); };
}

function openLightbox(list, start){
  let idx = start;
  const lb = document.createElement('div'); lb.className = 'lb';
  lb.innerHTML = `<button class="x" aria-label="Zamknij">✕</button>${list.length > 1 ? '<button class="prev" aria-label="Poprzednie">‹</button><button class="next" aria-label="Następne">›</button>' : ''}<img alt="">`;
  const img = $('img', lb);
  const show = () => { img.src = list[idx]; };
  const close = () => { lb.remove(); document.removeEventListener('keydown', onKey); };
  const step = d => { idx = (idx + d + list.length) % list.length; show(); };
  const onKey = e => { if (e.key === 'Escape') close(); if (e.key === 'ArrowLeft' && list.length > 1) step(-1); if (e.key === 'ArrowRight' && list.length > 1) step(1); };
  $('.x', lb).onclick = close;
  if (list.length > 1){ $('.prev', lb).onclick = () => step(-1); $('.next', lb).onclick = () => step(1); }
  lb.addEventListener('click', e => { if (e.target === lb) close(); });
  document.addEventListener('keydown', onKey);
  document.body.appendChild(lb); show();
}

  if (trip.created_by === author) items.push({ label: 'Usuń ' + noun(trip), icon: ICON.trash, danger: true, onClick: () => deleteTrip(trip) });
  return items;
}

/* ---------- wyjazd: dodawanie / edycja ---------- */
async function openTripSheet(trip, kindArg){
  let kind = CONFIG.EVENTS ? (trip ? (isLife(trip) ? 'life' : 'trip') : (kindArg || 'trip')) : 'trip';
  let cat = trip && trip.category ? trip.category : PRESET_CATS[0];
  let customIcon = CAT_EMOJIS[0];
  let known = [];
  if (CONFIG.EVENTS){
    try { const r = await sb.from('trips').select('category'); known = [...new Set((r.data || []).map(x => x.category).filter(Boolean))].filter(c => !PRESET_CATS.includes(c)); } catch (e) {}
  }
  let custom = false;
  const sh = openSheet(trip ? 'Edytuj' : 'Nowy wyjazd', `
    ${CONFIG.EVENTS ? '<div class="seg" id="kindSeg"><button type="button" class="chip" data-k="trip">Wyjazd</button><button type="button" class="chip" data-k="life">Wydarzenie z życia</button></div><div id="catBox"></div>' : ''}
    <label id="tnl">Nazwa wyjazdu<input id="tn" maxlength="80" placeholder="np. Toskania" value="${esc(trip ? trip.name : '')}"></label>
    <div id="dp"></div>
    <label>Okładka (zdjęcie, opcjonalnie)</label>
    <input type="file" id="cv" accept="image/*" hidden>
    <button type="button" class="chip" id="pickcv">${ICON.cam}Wybierz zdjęcie</button> <span class="muted" id="cvname" style="font-size:.85rem"></span>
    ${trip && trip.cover_path ? '<p class="muted" style="margin:8px 0 0;font-size:.85rem">Wybranie nowego zdjęcia zastąpi obecną okładkę.</p>' : ''}
    <p class="status" id="st"></p>`);
  const titleEl = $('h2', sh.el);
  function drawKind(){
    if (!CONFIG.EVENTS) return;
    sh.el.querySelectorAll('#kindSeg .chip').forEach(b => b.classList.toggle('on', b.dataset.k === kind));
    const life = kind === 'life';
    titleEl.textContent = life ? (trip ? 'Edytuj wydarzenie' : 'Nowe wydarzenie') : (trip ? 'Edytuj wyjazd' : 'Nowy wyjazd');
    $('#tnl', sh.el).firstChild.textContent = life ? 'Nazwa wydarzenia' : 'Nazwa wyjazdu';
    $('#tn', sh.el).placeholder = life ? 'np. Narodziny Zosi' : 'np. Toskania';
    const box = $('#catBox', sh.el);
    if (!life){ box.innerHTML = ''; return; }
    const all = [...PRESET_CATS, ...known];
    const inList = all.includes(cat);
    box.innerHTML = `<label>Kategoria</label><div class="cats">${all.map(c => `<button type="button" class="chip${!custom && c === cat ? ' on' : ''}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}<button type="button" class="chip${custom ? ' on' : ''}" id="cnew">+ Własna</button></div>
      ${custom ? `<div id="cust"><input id="cname" maxlength="40" placeholder="np. Przeprowadzka" value="${esc(inList ? '' : catParts(cat).name)}" style="margin-top:10px"><div class="emojis">${CAT_EMOJIS.map(e => `<button type="button" data-e="${e}" class="${e === customIcon ? 'on' : ''}">${e}</button>`).join('')}</div></div>` : ''}`;
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { cat = b.dataset.c; custom = false; drawKind(); });
    $('#cnew', box).onclick = () => { custom = true; drawKind(); const i = $('#cname', box); if (i) i.focus(); };
    box.querySelectorAll('[data-e]').forEach(b => b.onclick = () => { const v = $('#cname', box).value; customIcon = b.dataset.e; drawKind(); $('#cname', sh.el).value = v; });
  }
  if (CONFIG.EVENTS){
    if (kind === 'life' && trip && trip.category && !PRESET_CATS.includes(trip.category) && !known.includes(trip.category)) known.push(trip.category);
    sh.el.querySelectorAll('#kindSeg .chip').forEach(b => b.onclick = () => { kind = b.dataset.k; drawKind(); });
    drawKind();
  }
  const picker = makeDatePicker({ date: trip ? trip.date_from : todayStr(), end: trip ? trip.date_to : null, prec: trip ? trip.date_precision : 'day', withEnd: true, span: true });
  $('#dp', sh.el).appendChild(picker.el);
  const cv = $('#cv', sh.el);
  $('#pickcv', sh.el).onclick = () => cv.click();
  cv.onchange = () => { $('#cvname', sh.el).textContent = cv.files[0] ? cv.files[0].name : ''; };
  sh.saveBtn.onclick = async () => {
    const name = $('#tn', sh.el).value.trim();
    const d = picker.get();
    if (!name) return toast('Wpisz nazwę');
    if (!d.date) return toast('Wybierz datę');
    let category = null;
    if (kind === 'life'){
      if (custom){
        const cn = ($('#cname', sh.el).value || '').trim();
        if (!cn) return toast('Wpisz nazwę własnej kategorii');
        category = customIcon + ' ' + cn;
      } else category = cat;
    }
    if (d.end && d.end < d.date) return toast('Data końca jest wcześniejsza niż początku');
    const unchanged = trip && d.date === trip.date_from && d.end === trip.date_to && d.prec === trip.date_precision;
    if (d.end && !unchanged){ const er = endRangeFor(d.date, d.prec); if (!fits(d.end, d.prec, er)) return toast('Data końca może być najwyżej 3 tygodnie po początkowej'); }
    sh.saveBtn.disabled = true;
    try {
      let cover_path = trip ? trip.cover_path : null;
      const f = cv.files[0];
      if (f){
        $('#st', sh.el).textContent = 'Wysyłam okładkę…';
        const np = await uploadImage(f, 'covers');
        if (cover_path) await removePhotos([cover_path]);
        cover_path = np;
      }
      const row = { name, date_from: d.date, date_to: d.end, date_precision: d.prec, cover_path };
      if (CONFIG.EVENTS){ row.kind = kind; row.category = category; }
      if (trip){ if (author !== trip.created_by) row.edited_by = author; await writeRow('trips', row, trip.id); }
      else { row.created_by = author; await writeRow('trips', row, null); }
      sh.close(); route();
    } catch (err) { toast('Nie udało się zapisać: ' + (err.message || err)); sh.saveBtn.disabled = false; $('#st', sh.el).textContent = ''; }
  };
}
async function deleteTrip(trip){
  if (!confirm(`Usunąć ${noun(trip)} „${trip.name}” razem ze wszystkimi wspomnieniami i zdjęciami? Tego nie da się cofnąć.`)) return;
  const { data: mems } = await sb.from('memories').select('photos').eq('trip_id', trip.id);
  const { error } = await sb.from('trips').delete().eq('id', trip.id);
  if (error) return toast('Nie udało się usunąć: ' + error.message);
  await removePhotos([trip.cover_path, ...(mems || []).flatMap(x => x.photos || [])]);
  if (location.hash === '#/' || location.hash === '') route(); else location.hash = '#/';
}

/* ---------- widok wyjazdu ---------- */
function dateCol(x){
  const p = parts(x.event_date), mon = MON_ABBR[p.m - 1];
  if (x.date_precision === 'year') return `<div class="tl-date"><b class="yr">${p.y}</b></div>`;
  if (x.date_precision === 'month') return `<div class="tl-date"><b class="mo">${mon}</b><span>${p.y}</span></div>`;
  return `<div class="tl-date"><b>${p.d}</b><span>${mon}</span><span>${p.y}</span></div>`;
}
function timelineHtml(mems, urls, edit){
  return `<div class="tl">${mems.map((x, mi) => {
    const ph = (x.photos || []).filter(p => urls[p]);
    return `<div class="tl-item">${dateCol(x)}<span class="tl-dot"></span>
      <article class="tl-card">
        <div class="tl-head"><div>${x.title ? `<h3>${esc(x.title)}</h3>` : ''}<div class="tl-by">${esc(x.author)}${x.edited_by ? ` · poprawione przez ${esc(x.edited_by)}` : ''}</div></div>${edit ? `<button class="kebab" data-kebab="${mi}" aria-label="Menu">${ICON.more}</button>` : ''}</div>

function heroHtml(trip, urls, count, interactive){
  const cover = urls[trip.cover_path];

    ${interactive ? `<div class="hero-bar"><a class="rbtn" href="#/" aria-label="Wróć">${ICON.back}</a><button class="rbtn" id="tripMenu" aria-label="Menu">${ICON.dots}</button></div>` : ''}

}

async function deleteMemory(mem){
  if (!confirm('Usunąć to wspomnienie razem ze zdjęciami?')) return;
  const { error } = await sb.from('memories').delete().eq('id', mem.id);
  if (error) return toast('Nie udało się usunąć: ' + error.message);
  await removePhotos(mem.photos);
  route();
}
async function addPhotosTo(mem, files){
  const pt = persistentToast();
  try {
    const up = [];
    for (let i = 0; i < files.length; i++){ pt.set(`Wysyłam zdjęcie ${i + 1} z ${files.length}…`); up.push(await uploadImage(files[i], mem.trip_id)); }
    const row = { photos: [...(mem.photos || []), ...up], updated_at: new Date().toISOString() };
    if (author !== mem.author) row.edited_by = author;
    await writeRow('memories', row, mem.id);
    pt.done(); route();
  } catch (err) { pt.done(); toast('Nie udało się dodać zdjęć: ' + (err.message || err)); }
}

/* ---------- dodawanie / edycja wspomnienia ---------- */
function openMemorySheet(trip, mem, urls){
  const sh = openSheet(mem ? 'Edytuj wpis' : 'Dodaj wpis', `
    <p class="muted sh-sub">${esc(trip.name)}</p>
    <div id="dp"></div>
    <label>Tytuł<input id="ti" maxlength="80" placeholder="np. Przyjazd do Livorno"></label>
    <label>Notatka<textarea id="tx" placeholder="Co pamiętasz z tego dnia?"></textarea></label>
    <label>Zdjęcia</label>
    <div class="thumbs" id="th"></div>
    <div class="add-row"><button type="button" class="plus-tile" id="plus" aria-label="Dodaj zdjęcia">${ICON.plus}</button><button type="button" class="pbtn" id="addp">${ICON.cam}Dodaj zdjęcia</button></div>
    <p class="status" id="st"></p>`);
  let range = tripRange(trip);
  if (mem){   // starszy wpis spoza zakresu: nie wymuszaj zmiany daty
    const a = startOfPeriod(mem.event_date, mem.date_precision), b = endOfPeriod(mem.event_date, mem.date_precision);
    if (a < range.min) range.min = a;
    if (b > range.max) range.max = b;
  }
  const picker = makeDatePicker({ date: mem ? mem.event_date : (fits(todayStr(), 'day', range) ? todayStr() : range.min), prec: mem ? mem.date_precision : 'day', range });
  $('#dp', sh.el).appendChild(picker.el);
  $('#ti', sh.el).value = mem ? (mem.title || '') : '';
  const tx = $('#tx', sh.el); tx.value = mem ? (mem.body || '') : '';
  let keep = mem ? [...(mem.photos || [])] : [];
  let files = [];
  const th = $('#th', sh.el);
  function paintThumbs(){
    th.innerHTML = '';
    keep.forEach((p, i) => {
      const d = document.createElement('div'); d.className = 'th';
      d.innerHTML = `<figure class="fr" style="--r:${rot(i)}deg"><img src="${urls[p] || ''}" alt=""></figure><button type="button" aria-label="Usuń zdjęcie">✕</button>`;
      d.querySelector('button').onclick = () => { keep.splice(i, 1); paintThumbs(); };
      th.appendChild(d);
    });
    files.forEach((f, i) => {
      const d = document.createElement('div'); d.className = 'th';
      const u = URL.createObjectURL(f);
      d.innerHTML = `<figure class="fr" style="--r:${rot(keep.length + i)}deg"><img src="${u}" alt=""></figure><button type="button" aria-label="Usuń zdjęcie">✕</button>`;
      d.querySelector('button').onclick = () => { files.splice(i, 1); paintThumbs(); };
      th.appendChild(d);
    });
  }
  paintThumbs();
  const choose = () => pickPhotos(f => { files.push(...f); paintThumbs(); });
  $('#plus', sh.el).onclick = choose; $('#addp', sh.el).onclick = choose;
  sh.saveBtn.onclick = async () => {
    const d = picker.get();
    const body = tx.value.trim(), title = $('#ti', sh.el).value.trim();
    if (!d.date) return toast('Wybierz datę wspomnienia');
    if (d.date && !fits(d.date, d.prec, range)) return toast('Data wpisu musi mieścić się w terminie wyjazdu');
    if (!body && !title && !keep.length && !files.length) return toast('Dodaj tekst albo zdjęcie');
    sh.saveBtn.disabled = true;
    try {
      const uploaded = [];
      for (let i = 0; i < files.length; i++){
        $('#st', sh.el).textContent = `Wysyłam zdjęcie ${i + 1} z ${files.length}…`;
        uploaded.push(await uploadImage(files[i], trip.id));
      }
      $('#st', sh.el).textContent = 'Zapisuję…';
      const row = { trip_id: trip.id, author: mem ? mem.author : author, title, body, event_date: d.date, date_precision: d.prec, photos: [...keep, ...uploaded] };
      if (mem){ row.updated_at = new Date().toISOString(); if (author !== mem.author) row.edited_by = author; }
      const dropped = await writeRow('memories', row, mem ? mem.id : null);
      if (mem) await removePhotos((mem.photos || []).filter(p => !keep.includes(p)));
      sh.close(); route();
      if (dropped.includes('title') && title) toast('Wpis zapisany, ale tytuł wymaga jednorazowej aktualizacji bazy (skrypt SQL z instrukcji).');
    } catch (err) { toast('Nie udało się zapisać: ' + (err.message || err)); sh.saveBtn.disabled = false; $('#st', sh.el).textContent = ''; }
  };
}

/* ---------- eksport na pamiątkę (jeden plik HTML ze zdjęciami w środku) ---------- */
const slug = s => String(s || '').toLowerCase().replace(/ł/g, 'l').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'pamietnik';
function blobToDataUrl(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob); }); }
async function inlinePhotos(paths, onProgress){
  paths = [...new Set((paths || []).filter(Boolean))];
  const urls = await signed(paths);
  const out = {}; let done = 0, i = 0;
  async function worker(){
    while (i < paths.length){
      const p = paths[i++];
      try { if (urls[p]){ const resp = await fetch(urls[p]); if (resp.ok) out[p] = await blobToDataUrl(await resp.blob()); } } catch (e) {}
      done++; if (onProgress) onProgress(done, paths.length);
    }
  }
  await Promise.all([worker(), worker(), worker(), worker()]);
  return out;
}
function exportTripHtml(trip, mems, img, idx){
  const count = mems.reduce((n, x) => n + (x.photos || []).filter(p => img[p]).length, 0);

}

  return `<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>${esc(CONFIG.TITLE)}: pamiątka</title>${fl ? `<link rel="stylesheet" href="${fl.href}">` : ''}<style>${css}

async function exportDiary(tripIds, btn){
  const label = btn ? btn.innerHTML : '';
  const pt = btn ? null : persistentToast();
  if (btn) btn.disabled = true;
  const setLabel = t => { if (btn) btn.innerHTML = `${ICON.dl}${t}`; else pt.set(t); };
  try {
    setLabel('Zbieram wspomnienia…');
    let tq = sb.from('trips').select('*').order('date_from', { ascending: true });
    if (tripIds) tq = tq.in('id', tripIds);
    const { data: trips, error } = await tq;
    if (error) throw error;
    if (!trips.length) { toast('Nie ma jeszcze żadnego wyjazdu.'); return; }
    const { data: mems, error: e2 } = await sb.from('memories').select('*').in('trip_id', trips.map(t => t.id)).order('event_date', { ascending: true }).order('created_at', { ascending: true });
    if (e2) throw e2;
    const img = await inlinePhotos([...trips.map(t => t.cover_path), ...mems.flatMap(x => x.photos || [])], (d, n) => setLabel(`Zdjęcia ${d}/${n}…`));
    const sections = trips.map((t, i) => exportTripHtml(t, mems.filter(x => x.trip_id === t.id), img, i)).join('\n');
    const doc = buildExportDoc(sections, trips.map(t => t.name));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([doc], { type: 'text/html;charset=utf-8' }));
    const d = new Date(), stamp = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    a.download = `${slug(CONFIG.TITLE)}-${trips.length === 1 ? slug(trips[0].name) : 'caly-pamietnik'}-${stamp}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    toast('Plik zapisany. Poszukaj go w pobranych.');
  } catch (err) {
    toast('Nie udało się przygotować pliku: ' + (err.message || err));
  } finally { if (btn){ btn.disabled = false; btn.innerHTML = label; } else pt.done(); }
}

/* ---------- start ---------- */
async function route(){
  closeMenu();
  if (notConfigured) return showSetupNeeded();
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return showLogin();
  if (!author) return askName();
  const m = location.hash.match(/^#\/trip\/([0-9a-fA-F-]+)/);
  if (m) viewTrip(m[1]); else viewHome();
}
window.addEventListener('hashchange', route);
route();
